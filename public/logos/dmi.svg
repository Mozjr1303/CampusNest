  </defs>
  <!-- Shield Background -->
  <path d="M60 12 L100 24 C100 68 84 96 60 108 C36 96 20 68 20 24 Z" fill="url(#dmiBlue)" stroke="url(#dmiGold)" stroke-width="3" />
