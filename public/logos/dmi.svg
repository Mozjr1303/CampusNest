  <rect x="44" y="38" width="32" height="8" rx="1.5" fill="url(#dmiGold)" />
  <!-- Dove of Peace / Lake Wave Motif -->
  <path d="M38 72 Q60 62 82 72 Q60 78 38 72 Z" fill="#60A5FA" opacity="0.8" />
  <circle cx="60" cy="54" r="4" fill="#ffffff" />
  <!-- Banner -->
